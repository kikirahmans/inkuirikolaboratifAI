<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="45%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glow & Arrow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Background -->
  <circle cx="80" cy="80" r="76" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="4.5" />

  <!-- Inner Subtle Ring -->
  <circle cx="80" cy="80" r="68" fill="none" stroke="#6366F1" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="4 3" />

  <!-- Collaborative Inquiring Arcs (Hands / Cycle of Inquiry) -->
  <!-- Left Inquiring Arc -->
  <path d="M 40 100 C 26 80, 32 46, 56 34" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" />
  <!-- Right Inquiring Arc with Arrow Head -->
  <path d="M 120 60 C 134 80, 128 114, 104 126" fill="none" stroke="url(#ringGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Data Progress Bars (Reflecting Evaluation & Growth) -->
  <rect x="91" y="74" width="6.5" height="18" rx="3.2" fill="#38BDF8" opacity="0.9" />
  <rect x="101" y="65" width="6.5" height="27" rx="3.2" fill="#10B981" />
  <rect x="111" y="55" width="6.5" height="37" rx="3.2" fill="url(#goldGrad)" />

  <!-- Open Book of Pedagogy / Reflection at Center-Bottom -->
  <!-- Left Page -->
  <path d="M 50 103 C 60 97, 72 98, 79 104 C 79 92, 70 87, 52 87 C 49 87, 49 101, 50 103 Z" fill="#E2E8F0" opacity="0.95" />
  <!-- Right Page -->
  <path d="M 110 103 C 100 97, 88 98, 81 104 C 81 92, 90 87, 108 87 C 111 87, 111 101, 110 103 Z" fill="#FFFFFF" />
  <!-- Book Spine Base -->
  <path d="M 80 104 L 80 90" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Upward Inquiring Transformation Arrow -->
  <path d="M 52 86 L 68 70 L 78 77 L 102 46" fill="none" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Arrow Head -->
  <polygon points="104,44 91,46 99,58" fill="#38BDF8" />

  <!-- Teacher / Collaborative Spark of Discovery (4-point star at top left) -->
  <path d="M 58 44 Q 58 52 50 52 Q 58 52 58 60 Q 58 52 66 52 Q 58 52 58 44 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Inner Sparkle -->
  <circle cx="80" cy="38" r="2.5" fill="#38BDF8" opacity="0.8" />
  <circle cx="42" cy="74" r="2" fill="#A7F3D0" opacity="0.8" />
</svg>
